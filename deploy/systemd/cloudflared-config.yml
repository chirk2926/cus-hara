# Cloudflare Tunnel の設定の例（docs/HOME_SERVER.md）。置き場所: /etc/cloudflared/config.yml
# ★ 向けるのはゲームのポート（本番 8787・テスト 8788）だけ。管理画面のポート（8790・8791）は絶対に書かない。
tunnel: <トンネルのID>
credentials-file: /etc/cloudflared/<トンネルのID>.json

ingress:
  - hostname: game.example.com
    service: http://127.0.0.1:8787
  # テスト環境（要件#118。テスト版のゲームの「ゲームサーバー」をここに向ける）
  - hostname: test.example.com
    service: http://127.0.0.1:8788
  - service: http_status:404

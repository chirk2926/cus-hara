name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# 既定は読み取りだけ。スクリーンショットを書き戻すジョブだけ書き込みを許す（要件#77）
permissions:
  contents: read

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable
  NODE_VERSION: 22.20.0

jobs:
  server:
    name: Server tests and translation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Test
        working-directory: server
        run: npm test
      - name: Translations (no missing English text)
        run: python3 tools/i18n.py check

  # コードを読まれにくくする（要件#94）: スクリプトと素材を AES-256 で暗号化して exe に入れる。
  # 暗号化した中身を読めるのは、同じ鍵を組み込んだ書き出し用のひな形（Godot の template）だけなので、ひな形をここで作る。
  # 鍵: リポジトリの Secrets に GODOT_SCRIPT_ENCRYPTION_KEY（64けたの16進数）があればそれを使う。無ければ初回に作って
  # Actions のキャッシュに入れて使い回す。ひな形の作成は30分ほどかかるが、鍵が同じなら2回目からはキャッシュで数秒。
  enc_template:
    name: Build encrypted export template
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.kid.outputs.cache_key }}
    steps:
      - name: Key id
        id: kid
        env:
          KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: |
          if [ -n "$KEY" ]; then id=$(printf %s "$KEY" | sha256sum | cut -c1-16); else id=auto-v1; fi
          echo "cache_key=godot-enc-tpl-${GODOT_RELEASE}-win64-${id}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/enc-tpl
          key: ${{ steps.kid.outputs.cache_key }}
      - name: Build the Windows template with the key
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: |
          set -e
          mkdir -p ~/enc-tpl
          if [ -z "$KEY" ]; then
            KEY=$(openssl rand -hex 32)
            printf %s "$KEY" > ~/enc-tpl/key.txt
          fi
          echo "::add-mask::$KEY"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 > /dev/null
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          pip install -q scons
          git clone -q --depth 1 --branch "${GODOT_RELEASE}" https://github.com/godotengine/godot.git "$RUNNER_TEMP/godot-src"
          cd "$RUNNER_TEMP/godot-src"
          SCRIPT_AES256_ENCRYPTION_KEY="$KEY" scons -j"$(nproc)" platform=windows target=template_release arch=x86_64 \
            use_mingw=yes d3d12=no accesskit=no debug_symbols=no
          cp bin/godot.windows.template_release.x86_64.exe ~/enc-tpl/windows_release_x86_64.exe
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/enc-tpl
          key: ${{ steps.kid.outputs.cache_key }}

  windows:
    name: Check client, play against the server, build Windows exe
    needs: [server, enc_template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Download Godot and export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -sSL -o godot.zip ${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -sSL -o templates.tpz ${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          # 落としたファイルが壊れていないか・すり替わっていないか（要件#108）: 同じリリースの SHA512-SUMS.txt と比べる
          if curl -sSfL -o sums.txt ${BASE}/SHA512-SUMS.txt; then
            for f in Godot_v${GODOT_RELEASE}_linux.x86_64.zip Godot_v${GODOT_RELEASE}_export_templates.tpz; do
              want=$(grep " $f\$" sums.txt | cut -d' ' -f1)
              local=$([ "$f" = "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" ] && echo godot.zip || echo templates.tpz)
              got=$(sha512sum "$local" | cut -d' ' -f1)
              if [ -n "$want" ] && [ "$want" != "$got" ]; then echo "::error::$f のチェックサムが合いません"; exit 1; fi
              [ -z "$want" ] && echo "::warning::$f のチェックサムが SHA512-SUMS.txt にありません"
            done
          else
            echo "::warning::SHA512-SUMS.txt を取れなかったので、チェックサムを確かめていません"
          fi
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: "Start the game server (no AI key, keyword judging, mock speech-to-text)"
        run: |
          cd server && npm ci
          (KONBINI_OPEN=1 LLM_MODE=offline STT_PROVIDER=mock ALLOW_SAME_IP_RANKED=1 TIME_SCALE=4 DB_PATH="$RUNNER_TEMP/ci.db" PORT=8787 \
            nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/v1/info

      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log

      - name: Solo smoke test (offline, Japanese)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=offline --lang=ja --profile=solo_ja 2>&1 | tee smoke_offline.log
          grep -q "SMOKE OK" smoke_offline.log

      - name: Solo smoke test (offline, Simplified Chinese)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=offline --lang=zh --profile=solo_zh --test 2>&1 | tee smoke_zh.log
          grep -q "SMOKE OK" smoke_zh.log

      - name: Solo smoke test (offline, Korean)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=offline --lang=ko --profile=solo_ko 2>&1 | tee smoke_ko.log
          grep -q "SMOKE OK" smoke_ko.log

      - name: Solo smoke test (via the server, English)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=server --lang=en --profile=solo_en --server=http://127.0.0.1:8787 2>&1 | tee smoke_server.log
          grep -q "SMOKE OK" smoke_server.log

      - name: Versus smoke test (ranked, text, two clients)
        run: |
          timeout 300 godot --headless -- --vs-smoke=text --profile=vsA --lang=ja --server=http://127.0.0.1:8787 > vs_a.log 2>&1 &
          PID_A=$!
          sleep 1
          timeout 300 godot --headless -- --vs-smoke=text --profile=vsB --lang=ja --server=http://127.0.0.1:8787 2>&1 | tee vs_b.log
          # 先に起動したほうが終わるまで待つ（要件#109: 決まった秒数の sleep は、遅いランナーで不安定だった）
          wait $PID_A || true
          echo "---- client A"; cat vs_a.log
          grep -q "VERSUS OK" vs_a.log
          grep -q "VERSUS OK" vs_b.log

      - name: Versus smoke test (ranked, voice, English, two clients)
        run: |
          timeout 300 godot --headless -- --vs-smoke=voice --profile=vvA --lang=en --server=http://127.0.0.1:8787 > vv_a.log 2>&1 &
          PID_A=$!
          sleep 1
          timeout 300 godot --headless -- --vs-smoke=voice --profile=vvB --lang=en --server=http://127.0.0.1:8787 2>&1 | tee vv_b.log
          # 先に起動したほうが終わるまで待つ（要件#109: 決まった秒数の sleep は、遅いランナーで不安定だった）
          wait $PID_A || true
          echo "---- client A"; cat vv_a.log
          grep -q "VERSUS OK" vv_a.log
          grep -q "VERSUS OK" vv_b.log

      - name: QA run (presses the new buttons and checks the results)
        run: |
          set -o pipefail
          timeout 420 godot --headless -- --qa --source=offline --lang=ja --profile=qa_ja 2>&1 | tee qa_ja.log
          grep -q "QA OK" qa_ja.log
          timeout 420 godot --headless -- --qa --source=offline --lang=ko --profile=qa_ko 2>&1 | tee qa_ko.log
          grep -q "QA OK" qa_ko.log

      - name: Fail on script errors
        if: always()
        run: |
          echo "---- server log"; tail -n 60 "$RUNNER_TEMP/server.log" || true
          if grep -E "SCRIPT ERROR|Parse Error|SMOKE TIMEOUT|VERSUS TIMEOUT|Node not inside tree|Invalid call|Invalid access|Invalid assignment" *.log; then
            echo "::error::Script errors found"
            exit 1
          fi

      - uses: actions/cache/restore@v4
        id: enc
        with:
          path: ~/enc-tpl
          key: ${{ needs.enc_template.outputs.cache_key }}
      # 暗号化の設定を書き出しの設定に足す（要件#94）。鍵はログに出さない
      - name: Turn on script encryption
        env:
          KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: |
          if [ ! -f ~/enc-tpl/windows_release_x86_64.exe ]; then
            echo "::error::暗号化用のひな形がありません（enc_template のジョブを確かめてください）"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            # 配る版は Secrets の鍵で作ること（要件#108）。自動の鍵はキャッシュが消えると変わる
            echo "::warning::GODOT_SCRIPT_ENCRYPTION_KEY が Secrets にないので、自動で作った鍵を使っています。ストアに出す版は Secrets に鍵を入れてから作ってください"
          fi
          python3 tools/enable_encryption.py export_presets.cfg ~/enc-tpl/windows_release_x86_64.exe

      # 鍵は書き出しの2つの手順の中だけで使う（要件#108: ほかの手順から見えないように）
      - name: Export Windows build
        env:
          KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: |
          if [ -z "$KEY" ]; then KEY=$(cat ~/enc-tpl/key.txt); fi
          echo "::add-mask::$KEY"
          mkdir -p build/windows
          GODOT_SCRIPT_ENCRYPTION_KEY="$KEY" godot --headless --export-release "Windows Desktop" build/windows/CusHara.exe 2>&1 | tee export.log
          test -s build/windows/CusHara.exe
          # 暗号化できているか: スクリプトの中の名前が exe の中にそのまま見えないこと（要件#94）
          if grep -a -q -e "_offer_difficulty" -e "res://scripts/main.gd" build/windows/CusHara.exe; then
            echo "::error::スクリプトが暗号化されていません"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-windows
          path: build/windows/

      # テスト版（要件#85）: デバッグパネル付きの exe と、手元で動かすゲームサーバー一式
      - name: Export Windows test build (debug panel + local server)
        env:
          KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: |
          if [ -z "$KEY" ]; then KEY=$(cat ~/enc-tpl/key.txt); fi
          echo "::add-mask::$KEY"
          mkdir -p build/windows_test
          GODOT_SCRIPT_ENCRYPTION_KEY="$KEY" godot --headless --export-release "Windows Desktop (Test)" build/windows_test/CusHara_Test.exe 2>&1 | tee export_test.log
          test -s build/windows_test/CusHara_Test.exe
          mkdir -p build/windows_test/server build/windows_test/data
          cp -r server/src server/public server/admin server/package.json server/package-lock.json build/windows_test/server/
          (cd build/windows_test/server && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          cp data/*.json build/windows_test/data/
          cp tools/test_bundle/* build/windows_test/

      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-windows-TEST
          path: build/windows_test/

  # スクリーンショット（コミットに [shots] があるときだけ）。リポジトリに書き戻すので、書く権限はこのジョブだけ（要件#108）
  shots:
    name: Render screenshots
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -sSL -o godot.zip ${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -sSL -o templates.tpz ${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          # 落としたファイルが壊れていないか・すり替わっていないか（要件#108）: 同じリリースの SHA512-SUMS.txt と比べる
          if curl -sSfL -o sums.txt ${BASE}/SHA512-SUMS.txt; then
            for f in Godot_v${GODOT_RELEASE}_linux.x86_64.zip Godot_v${GODOT_RELEASE}_export_templates.tpz; do
              want=$(grep " $f\$" sums.txt | cut -d' ' -f1)
              local=$([ "$f" = "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" ] && echo godot.zip || echo templates.tpz)
              got=$(sha512sum "$local" | cut -d' ' -f1)
              if [ -n "$want" ] && [ "$want" != "$got" ]; then echo "::error::$f のチェックサムが合いません"; exit 1; fi
              [ -z "$want" ] && echo "::warning::$f のチェックサムが SHA512-SUMS.txt にありません"
            done
          else
            echo "::warning::SHA512-SUMS.txt を取れなかったので、チェックサムを確かめていません"
          fi
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project
        run: godot --headless --import > /dev/null 2>&1 || true
      # コミットメッセージに [shots] を含むときだけ、実際に描画した画面を docs/screenshots/ に保存してコミットする
      - name: Render screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1
          rm -rf docs/screenshots
          for lang in ja en zh ko; do
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 godot --resolution 1280x720 -- --shots --lang=$lang --profile=shots_$lang 2>&1 | tee shots_$lang.log || true
          done
          # 画面の大きさ・縦横比が違う環境（要件#44, #45）
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 900 godot --resolution 1024x768 -- --shots --lang=en --shot-tag=4x3 --profile=shots_43 2>&1 | tee shots_43.log || true
          xvfb-run -a -s "-screen 0 1920x1040x24" timeout 900 godot --resolution 1920x1040 -- --shots --lang=ja --shot-tag=wide --profile=shots_wide 2>&1 | tee shots_wide.log || true
          # Microsoft Store 用（1920×1080。要件#100）: 撮った中から見せたい画面だけを docs/store/ に
          rm -rf docs/store build/store_shots
          mkdir -p docs/store
          for lang in ja en zh ko; do
            xvfb-run -a -s "-screen 0 1920x1080x24" timeout 900 godot --resolution 1920x1080 -- --shots --lang=$lang --shot-tag=store --profile=shots_store_$lang 2>&1 | tee shots_store_$lang.log || true
            n=1
            for s in 01_title konbini_1_play arcade_2_angry konbini_3c_id_card arcade_5_crane_adjust 10_versus_customer_view 06b_titles 06g_avatar_maker; do
              f=$(ls docs/screenshots/${lang}_store_${s}.* 2>/dev/null | head -1)
              [ -n "$f" ] && cp "$f" "docs/store/${lang}_$(printf %02d $n)_${s}.${f##*.}" && n=$((n+1))
            done
          done
          rm -f docs/screenshots/*_store_*
          git add -f docs/store
          cat shots_*.log > docs/screenshots/render.log || true
          grep -E "SCRIPT ERROR|ERROR|SHOT" docs/screenshots/render.log | head -80 || true
          # 撮影の途中でスクリプトのエラーが出たら、書き戻さずに失敗にする（要件#109: 見落とさないように）
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|SHOTS TIMEOUT" docs/screenshots/render.log; then
            echo "::error::撮影中にスクリプトのエラーが出ました"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots
          git commit -m "スクリーンショットを更新 [skip ci]" || exit 0
          git reset -q --hard HEAD
          # 前の実行のスクリーンショットとぶつかったら、こちら（新しい方）を使う。押し合いで負けたら少し待ってやり直す
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done

  # 暗号化した exe が本物の Windows で起動して遊べるか（鍵とひな形が合っていないと起動しない。要件#94）
  windows_run:
    name: Run the encrypted exe on Windows
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CusHara-windows
          path: game
      - name: Solo smoke test with the exported exe
        shell: pwsh
        run: |
          $log = "$PWD\smoke.log"
          $p = Start-Process -FilePath "game\CusHara.exe" -ArgumentList @("--headless", "--log-file", $log, "--", "--smoke", "--source=offline", "--lang=ja", "--profile=win_smoke") -PassThru -NoNewWindow
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "timeout" }
          Get-Content $log | Select-Object -Last 40
          if (-not (Select-String -Path $log -Pattern "SMOKE OK" -Quiet)) { throw "SMOKE OK not found" }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR|Parse Error" -Quiet) { throw "script errors" }

  msix:
    name: Build Microsoft Store package (MSIX)
    needs: windows
    runs-on: windows-latest
    env:
      # 本番の値は、リポジトリの Settings → Variables に登録する（パートナーセンターの「製品 ID」に表示される値）
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'CusHara.Dev' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=CusHaraDev' }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY || 'medal' }}
      MSIX_VERSION: ${{ vars.MSIX_VERSION || '0.2.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CusHara-windows
          path: msix_root
      - name: Pack MSIX
        shell: pwsh
        run: |
          Copy-Item -Recurse packaging/msix/Assets msix_root/Assets
          Get-ChildItem msix_root/Assets -Filter *.import | Remove-Item   # Godot の取り込み記録は入れない
          $m = Get-Content packaging/msix/AppxManifest.xml -Raw -Encoding UTF8
          $m = $m.Replace('__IDENTITY_NAME__', $env:MSIX_IDENTITY_NAME).Replace('__PUBLISHER__', $env:MSIX_PUBLISHER)
          $m = $m.Replace('__PUBLISHER_DISPLAY__', $env:MSIX_PUBLISHER_DISPLAY).Replace('__VERSION__', $env:MSIX_VERSION)
          [System.IO.File]::WriteAllText("$PWD/msix_root/AppxManifest.xml", $m, (New-Object System.Text.UTF8Encoding($false)))
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx.FullName pack /d msix_root /p out/CusHara.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Get-Item out/CusHara.msix
      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-msix
          path: out/CusHara.msix

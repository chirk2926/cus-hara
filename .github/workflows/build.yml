name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# 既定は読み取りだけ。スクリーンショットを書き戻すジョブだけ書き込みを許す（要件#77）
permissions:
  contents: read

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable
  NODE_VERSION: 22.20.0

jobs:
  server:
    name: Server tests and translation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Test
        working-directory: server
        run: npm test
      - name: Translations (no missing English text)
        run: python3 tools/i18n.py check

  windows:
    name: Check client, play against the server, build Windows exe
    permissions:
      contents: write   # スクリーンショットを書き戻すため
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Download Godot and export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -sSL -o godot.zip ${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -sSL -o templates.tpz ${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: "Start the game server (no AI key, keyword judging, mock speech-to-text)"
        run: |
          cd server && npm ci
          (LLM_MODE=offline STT_PROVIDER=mock ALLOW_SAME_IP_RANKED=1 TIME_SCALE=4 DB_PATH="$RUNNER_TEMP/ci.db" PORT=8787 \
            nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/v1/info

      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log

      - name: Solo smoke test (offline, Japanese)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=offline --lang=ja --profile=solo_ja 2>&1 | tee smoke_offline.log
          grep -q "SMOKE OK" smoke_offline.log

      - name: Solo smoke test (offline, Simplified Chinese)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=offline --lang=zh --profile=solo_zh 2>&1 | tee smoke_zh.log
          grep -q "SMOKE OK" smoke_zh.log

      - name: Solo smoke test (via the server, English)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke --source=server --lang=en --profile=solo_en --server=http://127.0.0.1:8787 2>&1 | tee smoke_server.log
          grep -q "SMOKE OK" smoke_server.log

      - name: Versus smoke test (ranked, text, two clients)
        run: |
          (timeout 300 godot --headless -- --vs-smoke=text --profile=vsA --lang=ja --server=http://127.0.0.1:8787 > vs_a.log 2>&1 &)
          sleep 1
          timeout 300 godot --headless -- --vs-smoke=text --profile=vsB --lang=ja --server=http://127.0.0.1:8787 2>&1 | tee vs_b.log
          sleep 5
          echo "---- client A"; cat vs_a.log
          grep -q "VERSUS OK" vs_a.log
          grep -q "VERSUS OK" vs_b.log

      - name: Versus smoke test (ranked, voice, English, two clients)
        run: |
          (timeout 300 godot --headless -- --vs-smoke=voice --profile=vvA --lang=en --server=http://127.0.0.1:8787 > vv_a.log 2>&1 &)
          sleep 1
          timeout 300 godot --headless -- --vs-smoke=voice --profile=vvB --lang=en --server=http://127.0.0.1:8787 2>&1 | tee vv_b.log
          sleep 5
          echo "---- client A"; cat vv_a.log
          grep -q "VERSUS OK" vv_a.log
          grep -q "VERSUS OK" vv_b.log

      - name: Fail on script errors
        if: always()
        run: |
          echo "---- server log"; tail -n 60 "$RUNNER_TEMP/server.log" || true
          if grep -E "SCRIPT ERROR|Parse Error|SMOKE TIMEOUT|VERSUS TIMEOUT" *.log; then
            echo "::error::Script errors found"
            exit 1
          fi

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/CusHara.exe 2>&1 | tee export.log
          test -s build/windows/CusHara.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-windows
          path: build/windows/

      # コミットメッセージに [shots] を含むときだけ、実際に描画した画面を docs/screenshots/ に保存してコミットする
      - name: Render screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1
          rm -rf docs/screenshots
          for lang in ja en zh; do
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 godot --resolution 1280x720 -- --shots --lang=$lang --profile=shots_$lang 2>&1 | tee shots_$lang.log || true
          done
          # 画面の大きさ・縦横比が違う環境（要件#44, #45）
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 900 godot --resolution 1024x768 -- --shots --lang=en --shot-tag=4x3 --profile=shots_43 2>&1 | tee shots_43.log || true
          xvfb-run -a -s "-screen 0 1920x1040x24" timeout 900 godot --resolution 1920x1040 -- --shots --lang=ja --shot-tag=wide --profile=shots_wide 2>&1 | tee shots_wide.log || true
          cat shots_*.log > docs/screenshots/render.log || true
          grep -E "SCRIPT ERROR|ERROR|SHOT" docs/screenshots/render.log | head -80 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots
          git commit -m "スクリーンショットを更新 [skip ci]" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

  msix:
    name: Build Microsoft Store package (MSIX)
    needs: windows
    runs-on: windows-latest
    env:
      # 本番の値は、リポジトリの Settings → Variables に登録する（パートナーセンターの「製品 ID」に表示される値）
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'CusHara.Dev' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=CusHaraDev' }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY || 'CusHara Dev' }}
      MSIX_VERSION: ${{ vars.MSIX_VERSION || '0.2.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CusHara-windows
          path: msix_root
      - name: Pack MSIX
        shell: pwsh
        run: |
          Copy-Item -Recurse packaging/msix/Assets msix_root/Assets
          $m = Get-Content packaging/msix/AppxManifest.xml -Raw -Encoding UTF8
          $m = $m.Replace('__IDENTITY_NAME__', $env:MSIX_IDENTITY_NAME).Replace('__PUBLISHER__', $env:MSIX_PUBLISHER)
          $m = $m.Replace('__PUBLISHER_DISPLAY__', $env:MSIX_PUBLISHER_DISPLAY).Replace('__VERSION__', $env:MSIX_VERSION)
          [System.IO.File]::WriteAllText("$PWD/msix_root/AppxManifest.xml", $m, (New-Object System.Text.UTF8Encoding($false)))
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx.FullName pack /d msix_root /p out/CusHara.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Get-Item out/CusHara.msix
      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-msix
          path: out/CusHara.msix

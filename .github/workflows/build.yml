name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable

jobs:
  windows:
    name: Check scripts and build Windows exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -sSL -o godot.zip ${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -sSL -o templates.tpz ${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log

      - name: Smoke test (auto-play every stage in script mode)
        run: |
          set -o pipefail
          timeout 300 godot --headless -- --smoke 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|SMOKE TIMEOUT" import.log smoke.log; then
            echo "::error::Script errors found"
            exit 1
          fi
          grep -q "SMOKE OK" smoke.log

      - name: Versus smoke test (two processes play a match over localhost)
        run: |
          set -o pipefail
          (timeout 300 godot --headless -- --smoke-host > vs_host.log 2>&1 &)
          sleep 2
          timeout 300 godot --headless -- --smoke-join 2>&1 | tee vs_join.log
          sleep 3
          echo "---- host log"; cat vs_host.log
          if grep -E "SCRIPT ERROR|Parse Error|VERSUS TIMEOUT" vs_host.log vs_join.log; then
            echo "::error::Versus smoke test failed"
            exit 1
          fi
          grep -q "VERSUS OK" vs_host.log
          grep -q "VERSUS OK" vs_join.log

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/CusHara.exe 2>&1 | tee export.log
          test -s build/windows/CusHara.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CusHara-windows
          path: build/windows/

      # コミットメッセージに [shots] を含むときだけ、実際に描画した画面を docs/screenshots/ に保存してコミットする
      - name: Render screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1
          rm -rf docs/screenshots
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 godot --resolution 1280x720 -- --shots 2>&1 | tee shots.log || true
          if ! grep -q "SHOTS OK" shots.log; then
            echo "Vulkan rendering failed; retrying with OpenGL"
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 godot --rendering-driver opengl3 --resolution 1280x720 -- --shots 2>&1 | tee shots.log || true
          fi
          grep -E "SCRIPT ERROR|ERROR|SHOT" shots.log | head -60 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots shots.log
          git commit -m "スクリーンショットを更新 [skip ci]" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

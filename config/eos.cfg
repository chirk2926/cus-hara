; Epic Online Services の ID のひな形。**このファイルには本物の値を書かない**（リポジトリに入るため）。
; 本物の値は、同じ形で config/eos.local.cfg に書く（.gitignore 済み。あればこちらより優先。docs/EOS.md）
; product_id が空のあいだは EOS を使わず、ゲームサーバーのマッチングだけで動く。
; client_secret はゲームに同梱される値（EOS の仕組み上、秘密鍵ではない）。サーバーの API キーとは別物。
[eos]
product_name="CusHara"
product_version=""
product_id=""
sandbox_id=""
deployment_id=""
client_id=""
client_secret=""
encryption_key=""
